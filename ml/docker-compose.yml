# Docker Compose for the ARGUS-KE ML Service.
#
# Brings up the FastAPI ML service ("ml") alongside a Postgres + pgvector
# database ("db"). The ml service is wired to the db via ARGUS_DATABASE_URL so
# enrolled embeddings persist in pgvector. Apply app/db/schema.sql once to
# create the extension, table and index.
#
# Quick start:
#   docker compose up --build
#   docker compose exec -T db psql -U argus -d argus < app/db/schema.sql
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
      POSTGRES_DB: argus
    volumes:
      - argus_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use pgvector-backed persistence against the db service.
      ARGUS_STORE_BACKEND: ${ARGUS_STORE_BACKEND:-auto}
      ARGUS_ML_BACKEND: ${ARGUS_ML_BACKEND:-stub}
      ARGUS_DATABASE_URL: postgresql://argus:${POSTGRES_PASSWORD:-argus}@db:5432/argus
    ports:
      - "8000:8000"

volumes:
  argus_pgdata:

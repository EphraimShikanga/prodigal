services:
  db:
    build:
      context: ./database
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
      POSTGRES_DB: argus
    volumes:
      - argus_backend_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://argus:${POSTGRES_PASSWORD:-argus}@db:5432/argus
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  argus_backend_pgdata:
